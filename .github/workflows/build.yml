name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # One APK per processor type keeps each download small. Almost every
      # phone from the last several years uses arm64.
      - name: Build release APKs
        run: >
          flutter build apk --release --split-per-abi
          --build-name=1.0.${{ github.run_number }}
          --build-number=${{ github.run_number }}

      - name: Name the APKs
        run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk SaveKit-arm64.apk
          mv app-armeabi-v7a-release.apk SaveKit-arm32.apk
          mv app-x86_64-release.apk SaveKit-x86_64.apk
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: savekit-apks
          path: build/app/outputs/flutter-apk/SaveKit-*.apk

      # Every push to main becomes a release with direct .apk downloads.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SaveKit 1.0.${{ github.run_number }}
          body: |
            Install **SaveKit-arm64.apk** on your phone (nearly all current Android phones).
            Use SaveKit-arm32.apk only for older 32-bit phones.

            If Android refuses to install over an older copy, uninstall the old one first.
          files: build/app/outputs/flutter-apk/SaveKit-*.apk
